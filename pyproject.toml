[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbench"
version = "0.1.0"
description = "Correctness-first RMSNorm and fused softmax GPU experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
gpu = ["triton>=3.0; sys_platform == 'linux'"]
test = ["pytest>=8"]

[project.scripts]
kernelbench = "kernelbench.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
